<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="编辑光电探测器外延结构，计算光学响应与厚度扫描。" />
    <title>PD TMM</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace">跳至工作区</a>
    <!-- 顶栏包含工作区切换、结构文件操作和运行按钮 -->
    <header class="app-header">
      <div class="identity"><h1>PD TMM</h1></div>
      <nav class="workspace-nav" aria-label="工作区">
        <button
          class="workspace-tab active"
          type="button"
          data-workspace="structure"
          aria-pressed="true"
        >
          结构与参数
        </button>
        <button class="workspace-tab" type="button" data-workspace="response" aria-pressed="false">
          光学响应
        </button>
        <button class="workspace-tab" type="button" data-workspace="scan" aria-pressed="false">
          厚度扫描
        </button>
      </nav>
      <div class="header-actions">
        <button id="importJson" class="subtle" type="button" title="导入层名、材料与厚度">
          导入
        </button>
        <input id="importJsonFile" type="file" accept="application/json,.json" hidden />
        <button id="exportJson" class="subtle" type="button" title="导出层结构 JSON">导出</button>
        <button id="reset" class="subtle" type="button">恢复默认</button>
        <button class="mobile-settings" data-open-settings type="button">模型设置</button>
      </div>
      <button id="run" class="primary" type="button">运行仿真</button>
    </header>
    <main id="workspace">
      <p class="error-message" id="appError" role="alert" hidden></p>
      <!-- 结构页左侧编辑参数和层表，右侧查看剖面 -->
      <section id="structureWorkspace" class="workspace-view" aria-label="结构与参数">
        <div class="structure-layout">
          <div class="structure-editor">
            <!-- 基础参数在这里编辑，其他模型选项放在设置弹窗 -->
            <div id="modelInputs" class="basic-settings">
              <label class="field">
                <span>目标波长 (nm)</span>
                <div><input id="targetWl" type="number" min="100" step="any" required /></div>
              </label>
              <label class="field">
                <span>起始波长 (nm)</span>
                <div><input id="wlStart" type="number" min="100" step="any" required /></div>
              </label>
              <label class="field">
                <span>结束波长 (nm)</span>
                <div><input id="wlEnd" type="number" min="100" step="any" required /></div>
              </label>
              <label class="field sample-field">
                <span>采样点数</span>
                <div><input id="wlPoints" type="number" min="2" max="301" step="1" required /></div>
              </label>
              <button class="settings-trigger" data-open-settings type="button">模型设置</button>
            </div>
            <!-- 层表由 AG Grid 挂载，列和行操作在 layer-grid.js 中配置 -->
            <section id="layerPanel" class="layer-panel" aria-labelledby="layersHeading">
              <div class="panel-heading">
                <h2 id="layersHeading">层结构</h2>
                <button id="addLayer" type="button">添加层</button>
              </div>
              <div id="layerList" aria-label="层结构，可编辑单元格"></div>
            </section>
          </div>
          <!-- 层条由当前结构生成，灰阶表示厚度，数值保留实际单位 -->
          <aside id="schematicPanel" class="schematic-panel" aria-labelledby="schematicHeading">
            <div class="panel-heading">
              <h2 id="schematicHeading">结构剖面</h2>
              <span id="stackTotal" class="schematic-note"></span>
              <button
                id="downloadStructure"
                class="subtle"
                type="button"
                aria-label="导出结构剖面 SVG"
              >
                SVG
              </button>
            </div>
            <div id="schematic" class="schematic"></div>
            <p class="light-entry">↑ 衬底入射</p>
          </aside>
        </div>
      </section>
      <!-- 响应页在运行后填入指标，参数改变后清空旧结果 -->
      <section id="responseWorkspace" class="workspace-view" aria-label="光学响应" hidden>
        <div class="summary">
          <div class="metric">
            <span id="targetMetricLabel">响应度</span>
            <strong>
              <b id="responsivity">—</b>
              <small>A/W</small>
            </strong>
          </div>
          <div class="metric">
            <span id="absorptionMetricLabel">目标吸收率</span>
            <strong id="absorption">—</strong>
            <span id="targetLayerName" class="sr-only"></span>
          </div>
          <div class="metric">
            <span>
              峰值
              <span id="peakWl"></span>
            </span>
            <strong>
              <b id="peakResponse">—</b>
              <small>A/W</small>
            </strong>
          </div>
          <button id="downloadCsv" type="button" data-result-export disabled>导出 CSV</button>
        </div>
        <!-- 光谱与场强共用计算结果，导出按钮跟随图表类型切换 -->
        <div class="analysis-toolbar">
          <div class="segmented" aria-label="结果类型">
            <button
              class="analysis-tab active"
              type="button"
              data-view="spectrum"
              aria-pressed="true"
            >
              光谱响应
            </button>
            <button class="analysis-tab" type="button" data-view="field" aria-pressed="false">
              腔内场强
            </button>
          </div>
          <div id="spectrumActions" class="chart-actions">
            <button id="downloadSpectrumSvg" type="button" data-result-export disabled>
              双轴 SVG
            </button>
            <button id="downloadResponsivitySvg" type="button" data-result-export disabled>
              响应度 SVG
            </button>
          </div>
        </div>
        <p id="resultContext" class="pending-note result-state" role="status"></p>
        <span id="modelStatus" class="sr-only"></span>
        <!-- 光谱使用双轴展示吸收率和响应度，提示框显示采样点数值 -->
        <div id="spectrumView" class="analysis-view">
          <div class="chart-surface">
            <div class="chart-heading">
              <span class="legend">
                <span>
                  <i></i>
                  吸收率
                </span>
                <span class="response">
                  <i></i>
                  响应度
                </span>
              </span>
              <span id="spectrumRange" class="sr-only"></span>
            </div>
            <div class="canvas-wrap spectrum-wrap">
              <canvas
                id="spectrumChart"
                role="img"
                aria-label="波长对应的吸收率与响应度曲线"
              ></canvas>
              <div id="spectrumTooltip" class="chart-tooltip" role="status"></div>
              <div id="emptySpectrum" class="empty-chart">运行仿真后查看光谱</div>
            </div>
          </div>
          <!-- 目标波长下的反射、吸收、透射和寄生损耗 -->
          <div class="energy-grid">
            <div>
              <span>反射 R</span>
              <b id="energyR">—</b>
            </div>
            <div>
              <span>目标吸收</span>
              <b id="energyA">—</b>
            </div>
            <div>
              <span>透射 T</span>
              <b id="energyT">—</b>
            </div>
            <div>
              <span>寄生吸收</span>
              <b id="parasitic">—</b>
            </div>
          </div>
        </div>
        <!-- 场强视图沿入射方向显示归一化电场强度 -->
        <div id="fieldView" class="analysis-view" hidden>
          <div class="chart-surface">
            <div class="chart-heading">
              <span id="fieldWavelength"></span>
              <span>归一化 |E|²</span>
            </div>
            <div class="canvas-wrap">
              <canvas id="fieldChart" role="img" aria-label="入射侧深度与归一化电场强度"></canvas>
              <div id="emptyField" class="empty-chart">运行仿真后查看场强</div>
            </div>
          </div>
        </div>
      </section>
      <!-- 单层扫描画曲线，双层扫描画热图，各自保留控制项和结果 -->
      <section id="scanWorkspace" class="workspace-view" aria-label="厚度扫描" hidden>
        <div class="scan-toolbar">
          <div class="segmented" aria-label="扫描类型">
            <button type="button" data-scan="single" class="active" aria-pressed="true">
              单层扫描
            </button>
            <button type="button" data-scan="double" aria-pressed="false">双层扫描</button>
          </div>
          <span id="scanContext" class="count"></span>
        </div>
        <!-- 单层扫描选择一层、厚度范围和采样点数 -->
        <section id="singleScanView" class="scan-layout">
          <div class="scan-controls">
            <div class="scan-axis">
              <label class="field">
                <span>扫描层</span>
                <select id="singleScanLayer"></select>
              </label>
              <div class="field-grid">
                <label class="field">
                  <span>起始 (nm)</span>
                  <div><input id="singleMin" type="number" min="0.01" step="any" required /></div>
                </label>
                <label class="field">
                  <span>结束 (nm)</span>
                  <div><input id="singleMax" type="number" min="0.01" step="any" required /></div>
                </label>
              </div>
            </div>
            <label class="field">
              <span>采样点数</span>
              <div>
                <input id="singlePoints" type="number" min="11" max="301" step="1" required />
              </div>
            </label>
            <button id="runSingleScan" class="primary" type="button">开始扫描</button>
            <div id="singleScanResult" class="scan-result" aria-live="polite"></div>
          </div>
          <div class="scan-chart">
            <div class="chart-heading">
              <span>● 最优点</span>
              <button id="downloadSingleScanSvg" type="button" disabled>导出 SVG</button>
            </div>
            <div class="canvas-wrap">
              <canvas id="singleScanChart" role="img" aria-label="单层厚度与响应度曲线"></canvas>
              <div id="emptySingleScan" class="empty-chart">设置范围后点击“开始扫描”</div>
            </div>
          </div>
        </section>
        <!-- 双层扫描分别设置 X、Y 层与范围，网格数用于两个方向 -->
        <section id="doubleScanView" class="scan-layout" hidden>
          <div class="scan-controls">
            <div class="scan-axis">
              <label class="field">
                <span>X 层</span>
                <select id="scanX"></select>
              </label>
              <div class="field-grid">
                <label class="field">
                  <span>起始 (nm)</span>
                  <div><input id="xMin" type="number" min="0.01" step="any" required /></div>
                </label>
                <label class="field">
                  <span>结束 (nm)</span>
                  <div><input id="xMax" type="number" min="0.01" step="any" required /></div>
                </label>
              </div>
            </div>
            <div class="scan-axis">
              <label class="field">
                <span>Y 层</span>
                <select id="scanY"></select>
              </label>
              <div class="field-grid">
                <label class="field">
                  <span>起始 (nm)</span>
                  <div><input id="yMin" type="number" min="0.01" step="any" required /></div>
                </label>
                <label class="field">
                  <span>结束 (nm)</span>
                  <div><input id="yMax" type="number" min="0.01" step="any" required /></div>
                </label>
              </div>
            </div>
            <!-- 两个方向共用采样数，旁边的乘数由脚本同步 -->
            <label class="field">
              <span>网格</span>
              <div>
                <input
                  id="scanResolution"
                  type="number"
                  min="8"
                  max="41"
                  step="1"
                  required
                  aria-label="每个方向的网格采样数"
                />
                <i id="gridDimensions"></i>
              </div>
            </label>
            <button id="runScan" class="primary" type="button">开始扫描</button>
            <div id="scanResult" class="scan-result" aria-live="polite"></div>
          </div>
          <div class="scan-chart">
            <div class="chart-heading">
              <span>＋ 最优点</span>
              <button id="downloadHeatmapSvg" type="button" disabled>导出 SVG</button>
            </div>
            <div class="canvas-wrap heatmap-wrap">
              <canvas id="heatmap" role="img" aria-label="两个光学层的厚度与响应度热图"></canvas>
              <div id="emptyHeatmap" class="empty-chart">设置范围后点击“开始扫描”</div>
            </div>
            <div id="heatScale" class="sr-only" hidden>
              响应度范围
              <span id="heatMin"></span>
              至
              <span id="heatMax"></span>
              A/W
            </div>
          </div>
        </section>
      </section>
    </main>
    <!-- 模型设置共用原生弹窗，桌面和手机入口都打开这里 -->
    <dialog id="modelDialog" class="settings-dialog" aria-labelledby="modelDialogTitle">
      <div class="dialog-heading">
        <h2 id="modelDialogTitle">模型设置</h2>
        <button id="closeSettings" type="button">完成</button>
      </div>
      <div class="settings-grid">
        <section class="setting-group">
          <!-- 边界介质影响入射和出射导纳，理想减反选项单独控制 -->
          <h3>边界介质</h3>
          <div class="field-grid">
            <label class="field">
              <span>入射介质 n</span>
              <div><input id="incidentN" type="number" min="0.01" step="any" required /></div>
            </label>
            <label class="field">
              <span>入射介质 k</span>
              <div><input id="incidentK" type="number" min="0" step="any" required /></div>
            </label>
            <label class="field">
              <span>出射介质 n</span>
              <div><input id="exitN" type="number" min="0.01" step="any" required /></div>
            </label>
            <label class="field">
              <span>出射介质 k</span>
              <div><input id="exitK" type="number" min="0" step="any" required /></div>
            </label>
          </div>
          <label class="check-row">
            <input id="idealAr" type="checkbox" />
            <span>
              背面理想减反膜
              <small>忽略背面直接反射，保留内部返回光</small>
            </span>
          </label>
        </section>
        <section class="setting-group">
          <!-- 色散模型的适用材料和文献来源放在选项旁边 -->
          <h3>材料色散</h3>
          <label class="check-row">
            <input id="wavelengthDependent" type="checkbox" />
            <span>
              波长相关 n(λ)、k(λ)
              <small>用于 InP 和 InGaAs 响应层</small>
            </span>
          </label>
          <label class="check-row">
            <input id="conservativeInGaAs" type="checkbox" />
            <span>
              保守 InGaAs 模型
              <small>开启色散后使用 Adachi 低 k 模型</small>
            </span>
          </label>
          <p class="help-text">
            InGaAs 默认使用 1260–1360 nm 校准表，超出范围取端点值；InP 使用 Sellmeier 模型
          </p>
          <div class="source-links">
            <a href="https://doi.org/10.1063/1.343580" target="_blank" rel="noreferrer">
              Adachi 文献 ↗
            </a>
            <a href="https://doi.org/10.1063/1.1714410" target="_blank" rel="noreferrer">
              InP 文献 ↗
            </a>
          </div>
        </section>
        <section class="setting-group">
          <!-- 高斯角谱影响光学求解，收集效率用于换算电流响应 -->
          <h3>光束与收集</h3>
          <label class="check-row">
            <input id="gaussian" type="checkbox" checked />
            <span>
              高斯角谱积分
              <small>对 TE / TM 两种偏振取平均</small>
            </span>
          </label>
          <div class="field-grid">
            <label class="field">
              <span>束腰 w₀</span>
              <div>
                <input id="waist" type="number" min="0.1" step="any" required />
                <i>µm</i>
              </div>
            </label>
            <label class="field">
              <span>角度采样</span>
              <div>
                <input id="angleSamples" type="number" min="6" max="48" step="1" required />
                <i>点</i>
              </div>
            </label>
            <label class="field">
              <span>收集效率</span>
              <div>
                <input id="collection" type="number" min="0" max="100" step="any" required />
                <i>%</i>
              </div>
            </label>
          </div>
        </section>
      </div>
    </dialog>
    <!-- 先加载本地表格依赖，再启动页面交互 -->
    <script src="./src/vendor-ag-grid.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
