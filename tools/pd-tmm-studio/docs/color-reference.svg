<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">PD 外延光学工作台 · 成熟配色参考</title><desc id="desc">三套 Radix 官方色阶的工作台用途对照：Gray 和 Teal 推荐，Slate 和 Indigo 备选，Sand 和 Bronze 为暖色对照。每套包含准确 HEX、按钮和选中行样本。材料色单独保留。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif">
